[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyrisearch-tauso"
version = "0.2.0"
description = "Python API over the RIsearch binary (RNA-RNA / RNA-DNA / DNA-DNA interaction search), tauso fork."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "GPL-3.0-or-later"}
maintainers = [
    {name = "Michael Kovaliov"},
]
keywords = ["bioinformatics", "rna", "rna-rna", "rna-dna", "interaction", "antisense", "oligonucleotide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
# risearch-tauso carries the binary this drives; pyarrow parses what it prints.
dependencies = [
    "risearch-tauso>=1.6.2",
    "pyarrow>=14",
]

[project.urls]
Homepage = "https://github.com/RedPenguin100/risearch"
Source = "https://github.com/RedPenguin100/risearch"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyrisearch_tauso*"]
