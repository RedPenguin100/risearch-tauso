name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-and-test:
    name: Build and test RIsearch1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # googletest is fetched by FetchContent; cache it so PRs don't re-clone it.
      # The sub-build under _deps records the checkout's absolute path, so the
      # key carries the repository: renaming it moves the checkout and anything
      # cached under the old name would point somewhere that no longer exists.
      - name: Cache googletest
        uses: actions/cache@v4
        with:
          path: RIsearch1/build/_deps
          key: gtest-v1.15.2-${{ runner.os }}-${{ github.repository }}

      - name: Configure
        run: cmake -S RIsearch1 -B RIsearch1/build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build RIsearch1/build -j

      - name: Tests
        run: ./RIsearch1/build/tests/risearch1_tests

      # setup.py builds the wheel through CMake with tests disabled; check that
      # path too, since it is what actually ships.
      - name: Wheel build path
        run: |
          cmake -S RIsearch1 -B /tmp/wheelbuild -DCMAKE_BUILD_TYPE=Release -DRISEARCH_BUILD_TESTS=OFF
          cmake --build /tmp/wheelbuild --target RIsearch -j
          test -x RIsearch1/bin/RIsearch

  gcc10:
    name: Build and test with GCC 10 (the wheel compiler)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The wheels ship from manylinux2014, whose toolchain is GCC 10, while the
      # job above uses whatever ubuntu-latest carries -- GCC 13 at present. Code
      # that only compiles on the newer one would pass CI and still break every
      # wheel, so the compiler that actually builds them gets its own job.
      #
      # Run through `docker run` rather than a `container:` job: manylinux2014 is
      # CentOS 7 (glibc 2.17) and the runner's node-based actions cannot start
      # there, so the checkout happens on the host and only the build goes in.
      - name: Build and test in manylinux2014
        run: |
          docker run --rm -v "$PWD":/io -w /io \
            quay.io/pypa/manylinux2014_x86_64 \
            bash -c '
              set -e
              cmake -S RIsearch1 -B /tmp/build -DCMAKE_BUILD_TYPE=Release
              cmake --build /tmp/build -j"$(nproc)"
              /tmp/build/tests/risearch1_tests
            '
